name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1. Configurar el entorno de Flutter
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true # Esto acelera las futuras ejecuciones

      # 2. Instalar dependencias
      - run: flutter pub get

      # 3. Construir la versión Web
      - run: flutter build web

      # 4. Desplegar en Firebase
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MINDBOX_B839E }}
          channelId: live
          projectId: mindbox-b839e